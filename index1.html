<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puhu Suomea! - Ääntämispeli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1.05); } 50% { opacity: .7; transform: scale(1); } }
    </style>
</head>
<body class="bg-sky-50 min-h-screen">

    <div id="app">
        </div>

    <script>
        // SANALISTA KOODISTASI
        const wordList = [
            { word: "Ylös", category: "Suunta" },
            { word: "Ulos", category: "Suunta" },
            { word: "Tyyny", category: "Koti" },
            { word: "Tuuli", category: "Luonto" },
            { word: "Pöytä", category: "Koti" },
            { word: "Kynä", category: "Koulu" },
            { word: "Sääri", category: "Keho" },
            { word: "Saari", category: "Luonto" },
            { word: "Öljy", category: "Ruoka" },
            { word: "Yö", category: "Aika" },
            { word: "Minä tykkään", category: "Lause" },
            { word: "Hän syö", category: "Lause" },
            { word: "Pallo lentää", category: "Lause" },
            { word: "Vihreä omena", category: "Lause" },
            { word: "Kylmä vesi", category: "Lause" },
            { word: "Ystävä", category: "Ihminen" },
            { word: "Kysyä", category: "Verbi" },
            { word: "Pysäkki", category: "Kaupunki" },
            { word: "Pyörä", category: "Kulkuneuvo" }
        ];

        let currentIndex = 0;
        let score = 0;
        let isListening = false;
        let feedback = null; // 'correct', 'wrong', 'error'
        let transcript = "";
        let gameState = 'start'; // 'start', 'playing', 'end'

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fi-FI';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const spoken = event.results[0][0].transcript.toLowerCase().trim();
                const target = wordList[currentIndex].word.toLowerCase().trim();
                transcript = spoken;
                
                // Joustava tarkistus koodisi mukaan
                if (spoken.includes(target) || target.includes(spoken)) {
                    feedback = 'correct';
                    score++;
                } else {
                    feedback = 'wrong';
                }
                isListening = false;
                render();
            };

            recognition.onerror = () => {
                isListening = false;
                feedback = 'error';
                render();
            };

            recognition.onend = () => {
                isListening = false;
                render();
            };
        }

        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fi-FI';
            window.speechSynthesis.speak(u);
        }

        function startListening() {
            if (!recognition) return;
            feedback = null;
            transcript = "";
            try {
                recognition.start();
                isListening = true;
                render();
            } catch (e) { console.error(e); }
        }

        function nextWord() {
            if (currentIndex < wordList.length - 1) {
                currentIndex++;
                feedback = null;
                transcript = "";
                render();
            } else {
                gameState = 'end';
                render();
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            if (gameState === 'start') {
                app.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center border-b-8 border-sky-200">
                        <div class="bg-sky-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="mic" class="w-12 h-12 text-sky-600"></i>
                        </div>
                        <h1 class="text-4xl font-black text-sky-900 mb-4 tracking-tight">PUHU SUOMEA!</h1>
                        <p class="text-gray-600 mb-8 text-lg">
                            Harjoitellaan vaikeita sanoja. Lue sana ääneen ja katso saatko pisteitä! <br/>
                            <span class="font-bold text-sky-600 italic">Muista: ä, ö, y!</span>
                        </p>
                        <button onclick="gameState='playing'; render();" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 px-8 rounded-2xl text-2xl transition-all shadow-lg active:scale-95">
                            ALOITA PELI
                        </button>
                    </div>
                </div>`;
            } else if (gameState === 'playing') {
                const item = wordList[currentIndex];
                const progress = ((currentIndex + 1) / wordList.length) * 100;

                app.innerHTML = `
                <div class="min-h-screen flex flex-col p-4">
                    <div class="w-full max-w-2xl mx-auto mb-8 pt-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sky-7
